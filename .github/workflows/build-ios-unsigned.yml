name: Build iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream PR 14 head
        run: |
          git remote add upstream https://github.com/zhoufuweigg/guoapp.git
          git fetch --depth=1 upstream refs/pull/14/head
          git checkout FETCH_HEAD
          git rev-parse HEAD
          grep -m1 '^version:' pubspec.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Refresh pubspec.lock
        run: flutter pub get
      - name: Build iOS unsigned IPA
        run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ matrix.edition }}
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
